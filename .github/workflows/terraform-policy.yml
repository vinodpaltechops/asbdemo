# Terraform Policy Validation Workflow
#
# This workflow enforces infrastructure policies on all Terraform changes using OPA/Conftest.
# It runs in 3 phases:
#
# 1. POLICY JOB (parallel for dev, prod, hub):
#    - Generates terraform plan in JSON format
#    - Runs Conftest against OPA policies
#    - Uploads policy reports as artifacts
#    - Comments on PR with results
#
# 2. POLICY-SUMMARY JOB:
#    - Collects results from all envs
#    - Creates consolidated PR comment
#
# 3. POLICY-GATE JOB (BLOCKS MERGE):
#    - Checks if ANY denials were found
#    - Parses policy reports (JSON format)
#    - Sets GitHub Check status (pass/fail)
#    - Exits with code 1 if denials found → BLOCKS PR MERGE
#
# BLOCKING BEHAVIOR:
#  - Warnings (WARN) → Allow merge, just comment
#  - Denials (FAIL) → Block merge, require fixes
#
# To merge despite warnings: Review warnings in PR comment and proceed
# To merge despite denials: IMPOSSIBLE without fixing violations or disabling policy

name: Terraform Policy Validation

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'infra/terragrunt/**'
      - '.conftest/**'
      - '.github/workflows/terraform-policy.yml'
  workflow_dispatch:

env:
  TF_VERSION: "1.9.0"
  TG_VERSION: "1.0.3"

jobs:
  policy:
    name: Policy Check (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod, hub]
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # For OIDC token

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Setup Conftest
        run: |
          CONFTEST_VERSION="0.46.0"
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz
          tar xzf conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          rm conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz

      - name: Terraform Plan (JSON format)
        working-directory: infra/terragrunt/envs/${{ matrix.env }}
        run: |
          terragrunt plan -json > /tmp/${{ matrix.env }}-plan.json 2>&1 || true
          echo "Plan generated for ${{ matrix.env }}"
          # Show summary (not full plan)
          echo "=== Plan Summary ==="
          terraform show -json /tmp/${{ matrix.env }}-plan.json | jq '.resource_changes | length' 2>/dev/null || echo "Could not parse plan"
        env:
          TF_INPUT: false
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Run OPA Policies
        working-directory: infra
        id: conftest
        run: |
          conftest test \
            -p .conftest/policy \
            /tmp/${{ matrix.env }}-plan.json \
            --namespace terraform \
            --output json \
            --fail-on-warn > /tmp/${{ matrix.env }}-policy-report.json 2>&1 || true

          # Also run with table format for readability
          conftest test \
            -p .conftest/policy \
            /tmp/${{ matrix.env }}-plan.json \
            --namespace terraform \
            --output table \
            2>&1 | tee /tmp/${{ matrix.env }}-policy-report.txt || true

      - name: Parse Policy Results
        id: results
        run: |
          REPORT_FILE="/tmp/${{ matrix.env }}-policy-report.json"

          if [ -f "$REPORT_FILE" ]; then
            DENIALS=$(cat "$REPORT_FILE" | jq '[.[] | select(.failures != null) | .failures[]] | length' 2>/dev/null || echo "0")
            WARNINGS=$(cat "$REPORT_FILE" | jq '[.[] | select(.warnings != null) | .warnings[]] | length' 2>/dev/null || echo "0")
          else
            DENIALS=0
            WARNINGS=0
          fi

          echo "denials=$DENIALS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

          # Print for debugging
          echo "Denials: $DENIALS, Warnings: $WARNINGS for ${{ matrix.env }}"

      - name: Upload Policy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-report-${{ matrix.env }}
          path: /tmp/${{ matrix.env }}-policy-report.*
          retention-days: 7

  # Summarize all results
  policy-summary:
    name: Policy Summary
    runs-on: ubuntu-latest
    needs: policy
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: policy-reports

      - name: Create PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## 🔐 Terraform Policy Validation Results\n\n';
            let totalDenials = 0;
            let totalWarnings = 0;
            let details = '### Policy Details\n\n';

            const reportDir = 'policy-reports';
            const envs = ['dev', 'prod', 'hub'];

            for (const env of envs) {
              const reportFile = path.join(reportDir, `policy-report-${env}`, `${env}-policy-report.txt`);

              if (fs.existsSync(reportFile)) {
                const content = fs.readFileSync(reportFile, 'utf8');

                // Count denials and warnings
                const denialCount = (content.match(/denial/gi) || []).length;
                const warningCount = (content.match(/warning/gi) || []).length;

                totalDenials += denialCount;
                totalWarnings += warningCount;

                const status = denialCount > 0 ? '❌' : warningCount > 0 ? '⚠️' : '✅';
                details += `<details><summary>${status} **${env}**: ${denialCount} denials, ${warningCount} warnings</summary>\n\n`;
                details += '```\n' + content + '\n```\n\n</details>\n\n';
              }
            }

            // Overall status
            const overallStatus = totalDenials > 0
              ? '❌ FAILED - Policy violations found'
              : totalWarnings > 0
              ? '⚠️ WARNINGS - Review suggestions below'
              : '✅ PASSED - All policies satisfied';

            comment += `${overallStatus}\n\n`;
            comment += `**Summary:** ${totalDenials} denials, ${totalWarnings} warnings\n\n`;
            comment += details;
            comment += '---\n';
            comment += '💡 To test locally: `conftest test -p .conftest/policy <(terragrunt plan -json) --namespace terraform`\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Fail the workflow if there are denials
  policy-gate:
    name: Policy Gate
    runs-on: ubuntu-latest
    needs: policy
    if: always()
    permissions:
      contents: read

    steps:
      - name: Download all policy reports
        uses: actions/download-artifact@v4
        with:
          path: policy-reports
        continue-on-error: true

      - name: Check for policy denials
        id: check
        run: |
          echo "📋 Checking for policy denials across all environments..."
          echo ""

          DENIALS_FOUND=0
          DENIAL_SUMMARY=""

          for env in dev prod hub; do
            REPORT_FILE="policy-reports/policy-report-${env}/${env}-policy-report.json"

            if [ -f "$REPORT_FILE" ]; then
              # Count denials using jq
              DENIAL_COUNT=$(jq '[.[] | select(.failures != null) | .failures[]] | length' "$REPORT_FILE" 2>/dev/null || echo "0")

              if [ "$DENIAL_COUNT" -gt 0 ]; then
                DENIALS_FOUND=1
                DENIAL_SUMMARY="${DENIAL_SUMMARY}• **${env}**: ${DENIAL_COUNT} policy denial(s)\n"
              fi
            fi
          done

          echo "check_result=$DENIALS_FOUND" >> $GITHUB_OUTPUT

          if [ $DENIALS_FOUND -eq 1 ]; then
            echo ""
            echo "❌ Policy Denials Found:"
            echo -e "$DENIAL_SUMMARY"
            exit 1
          else
            echo "✅ No policy denials found. Proceeding with merge approval."
            exit 0
          fi

      - name: Report policy gate result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkResult = '${{ steps.check.outputs.check_result }}';
            const status = checkResult === '0' ? '✅ PASSED' : '❌ FAILED';

            console.log(`Policy Gate Status: ${status}`);

            if ('${{ github.event_name }}' === 'pull_request') {
              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Policy Validation Gate',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: checkResult === '0' ? 'success' : 'failure',
                output: {
                  title: 'Policy Validation',
                  summary: checkResult === '0'
                    ? '✅ All environments passed policy checks'
                    : '❌ Policy denials found. Please review violations and fix before merging.'
                }
              });
            }


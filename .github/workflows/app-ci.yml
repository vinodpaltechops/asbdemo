name: app-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/docker-build-push.yml"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/docker-build-push.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Fetch secrets from Key Vault (only on push to main)
  # ─────────────────────────────────────────────────────────────
  fetch-secrets:
    name: Fetch ACR Credentials from Key Vault
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      acr-username: ${{ steps.secrets.outputs.acr-user }}
      acr-password: ${{ steps.secrets.outputs.acr-pass }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login & fetch secrets
        uses: ./.github/actions/azure-login-vault
        id: vault
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-names: 'acr-admin-user,acr-admin-password'

      - name: Extract secrets
        id: secrets
        run: |
          SECRETS='${{ steps.vault.outputs.secrets-json }}'
          echo "acr-user=$(echo "$SECRETS" | jq -r '."acr-admin-user"')" >> "$GITHUB_OUTPUT"
          echo "acr-pass=$(echo "$SECRETS" | jq -r '."acr-admin-password"')" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # Build and scan orders-service image using reusable workflow
  # ─────────────────────────────────────────────────────────────
  build-orders:
    name: Build & Scan Orders Service
    needs: [fetch-secrets]
    if: always()
    uses: ./.github/workflows/docker-build-push.yml
    with:
      dockerfile-path: app/orders-service/Dockerfile
      image-name: orders-service
      registry: ${{ vars.ACR_LOGIN_SERVER }}
      acr-username: ${{ needs.fetch-secrets.outputs.acr-username }}
      acr-password: ${{ needs.fetch-secrets.outputs.acr-password }}

  # ─────────────────────────────────────────────────────────────
  # Build and scan payments-service image using reusable workflow
  # ─────────────────────────────────────────────────────────────
  build-payments:
    name: Build & Scan Payments Service
    needs: [fetch-secrets]
    if: always()
    uses: ./.github/workflows/docker-build-push.yml
    with:
      dockerfile-path: app/payments-service/Dockerfile
      image-name: payments-service
      registry: ${{ vars.ACR_LOGIN_SERVER }}
      acr-username: ${{ needs.fetch-secrets.outputs.acr-username }}
      acr-password: ${{ needs.fetch-secrets.outputs.acr-password }}

  # ─────────────────────────────────────────────────────────────
  # Update GitOps manifests with new image tags (after push to ACR)
  # ─────────────────────────────────────────────────────────────
  bump-gitops:
    name: Bump GitOps Image Tags
    needs: [build-orders, build-payments]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Bump image tags in kustomization
        working-directory: gitops/workloads/envs/dev
        env:
          ORDERS_TAG: ${{ needs.build-orders.outputs.image-tag }}
          PAYMENTS_TAG: ${{ needs.build-payments.outputs.image-tag }}
        run: |
          echo "Updating orders-service to: ${{ env.ACR_LOGIN_SERVER }}/orders-service:${ORDERS_TAG}"
          kustomize edit set image \
            "${{ env.ACR_LOGIN_SERVER }}/orders-service=${{ env.ACR_LOGIN_SERVER }}/orders-service:${ORDERS_TAG}"

          echo "Updating payments-service to: ${{ env.ACR_LOGIN_SERVER }}/payments-service:${PAYMENTS_TAG}"
          kustomize edit set image \
            "${{ env.ACR_LOGIN_SERVER }}/payments-service=${{ env.ACR_LOGIN_SERVER }}/payments-service:${PAYMENTS_TAG}"

      - name: Commit and push GitOps changes
        env:
          ORDERS_TAG: ${{ needs.build-orders.outputs.image-tag }}
          PAYMENTS_TAG: ${{ needs.build-payments.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/workloads/envs/dev/kustomization.yaml

          if git diff --staged --quiet; then
            echo "✓ No image tag changes needed"
            exit 0
          fi

          git commit -m "ci(gitops): bump orders:${ORDERS_TAG} payments:${PAYMENTS_TAG}"
          git push

      - name: Notify sync
        run: |
          echo "✓ GitOps manifests updated"
          echo "✓ ArgoCD will auto-sync within 3 minutes"

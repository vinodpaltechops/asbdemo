name: 'Azure Login & Get Key Vault Secrets'
description: 'Login to Azure OIDC and fetch secrets from Key Vault using native action'

inputs:
  client-id:
    description: 'Azure Client ID'
    required: true
  tenant-id:
    description: 'Azure Tenant ID'
    required: true
  subscription-id:
    description: 'Azure Subscription ID'
    required: true
  key-vault-name:
    description: 'Key Vault name'
    required: true
  secret-names:
    description: 'Comma-separated secret names to fetch'
    required: true

outputs:
  secrets-json:
    description: 'JSON object of fetched secrets'
    value: ${{ steps.format-secrets.outputs.secrets-json }}

runs:
  using: 'composite'
  steps:
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        auth-type: SERVICE_PRINCIPAL

    - name: Get secrets from Key Vault
      uses: azure/get-keyvault-secrets@v1
      id: kv-secrets
      with:
        keyvault: ${{ inputs.key-vault-name }}
        secrets: ${{ inputs.secret-names }}

    - name: Format secrets as JSON
      id: format-secrets
      shell: bash
      env:
        # Pass all outputs from kv-secrets as environment variable
        KV_OUTPUTS: ${{ toJson(steps.kv-secrets.outputs) }}
      run: |
        # Convert outputs to JSON format with original secret names
        # azure/get-keyvault-secrets converts names: acr-admin-user -> acr-admin-user (kept as-is in outputs)

        secrets_json='{}'

        # Parse secret names from input
        IFS=',' read -ra SECRETS <<< "${{ inputs.secret-names }}"

        # Get all KV outputs as JSON
        all_outputs=$(echo "$KV_OUTPUTS" | jq .)

        for secret in "${SECRETS[@]}"; do
          # Trim whitespace
          secret=$(echo "$secret" | xargs)

          # Get value from outputs (azure/get-keyvault-secrets keeps the original secret name)
          value=$(echo "$all_outputs" | jq -r ".[\"$secret\"] // empty")

          if [ -z "$value" ]; then
            echo "⚠️  Warning: Secret '$secret' not found or empty in Key Vault outputs" >&2
          else
            # Build JSON object: {"acr-admin-user": "value", ...}
            secrets_json=$(echo "$secrets_json" | jq --arg key "$secret" --arg val "$value" '.[$key] = $val')
          fi
        done

        echo "secrets-json=$(echo "$secrets_json" | jq -c .)" >> "$GITHUB_OUTPUT"
        secret_count=$(echo "$secrets_json" | jq 'keys | length')
        echo "✓ Successfully fetched $secret_count secret(s) from Key Vault" >&2
